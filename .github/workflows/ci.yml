name: CI

on:
  push:
    branches: [main, stable]
  pull_request:
    branches: [main, stable]
  workflow_dispatch:

# Least privilege: the workflow only needs to read the repo.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Version consistency
        run: node scripts/check-version.mjs

      # SECURITY.md: "TypeScript errors are fatal" — actually true now.
      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      # Pure-logic units + real route-handler integration tests (temp SQLite).
      - name: Unit + API tests
        run: bun test tests/unit tests/api

      - name: Vendored binary provenance
        run: node scripts/sync-vendor.mjs --check

      # Non-mutating i18n audit: orphan keys, malformed entries, stale
      # progress file. Missing translations are allowed (English fallback);
      # inconsistencies are not.
      - name: i18n consistency
        run: bun scripts/i18n-missing.ts --check

      - name: Static export build
        run: bun run build:static

      # Bundle budget — fail when shipped JS grows >10% vs the committed
      # baseline, so size creep is a conscious decision, never an accident.
      - name: JS bundle budget
        run: bun run budget

      - name: Upload static site artifact
        uses: actions/upload-artifact@v7
        with:
          name: static-site
          path: .next-static/
          retention-days: 7

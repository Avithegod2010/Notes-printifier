name: Translation badge

# Translate-a-thon automation — regenerates i18n-progress.json (percent
# translated per language) after every push to main and commits it back so
# the README's shields.io dynamic badges stay current. No-op when nothing
# changed (the [skip ci] in the commit message prevents loops).

on:
  push:
    branches: [main]
    paths:
      - "src/lib/i18n.ts"
      - "scripts/i18n-missing.ts"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: i18n-badge
  cancel-in-progress: true

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Regenerate progress JSON
        run: bun scripts/i18n-missing.ts

      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet i18n-progress.json MISSING_TRANSLATIONS.md; then
            echo "No translation progress change — nothing to commit."
            exit 0
          fi
          git config user.name "printifier-i18n-bot"
          git config user.email "actions@users.noreply.github.com"
          git add i18n-progress.json MISSING_TRANSLATIONS.md
          git commit -m "chore(i18n): refresh translation progress badge [skip ci]"
          git push

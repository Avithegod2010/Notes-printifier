# Dependabot — weekly dependency + action updates.
#
# The "bun" ecosystem reads bun.lock directly (override-aware): version-update
# PRs edit the lockfile, and alert computation sees the REAL resolved versions
# instead of guessing from package.json ranges — this is what finally stops the
# phantom "high" alerts on transitive toolchain packages (sharp, minimatch, …)
# whose in-range older versions carry advisories but are never installed.
# (GA since Feb 2025; enable-beta-ecosystems kept as a safety net.)
version: 2
enable-beta-ecosystems: true
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      dev-minor:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Pinned majors managed deliberately via package.json "overrides"
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
